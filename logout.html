<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déconnexion</title>
    <link rel="stylesheet" href="frontend/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    <script src="frontend/js/common.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    function Logout() {
        React.useEffect(() => {
            apiCall('logout', 'POST').then(() => window.location.href = 'login.html');
        }, []);
        return <div className="auth-container"><div className="auth-card">Déconnexion en cours...</div></div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Logout />);
</script>
</body>
</html>
