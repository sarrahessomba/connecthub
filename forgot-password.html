<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié</title>
    <link rel="stylesheet" href="frontend/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    <script src="frontend/js/common.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState } = React;
    function ForgotPassword() {
        const [email, setEmail] = useState('');
        const [message, setMessage] = useState({ text: '', type: '' });
        const handleSubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(); fd.append('email', email);
            try {
                const data = await apiCall('forgot_password', 'POST', fd);
                if (data.success) setMessage({ text: data.message, type: 'success' });
                else setMessage({ text: data.error, type: 'error' });
            } catch (err) {
                setMessage({ text: 'Erreur réseau', type: 'error' });
            }
        };
        return (
            <div className="auth-container">
                <div className="auth-card">
                    <h1>ConnectHub</h1>
                    <h2>Réinitialisation</h2>
                    <form onSubmit={handleSubmit}>
                        <input type="email" placeholder="Votre email" value={email} onChange={e => setEmail(e.target.value)} required />
                        <button type="submit">Envoyer</button>
                    </form>
                    {message.text && <div className={`message ${message.type}`}>{message.text}</div>}
                    <p><a href="login.html">Retour à la connexion</a></p>
                </div>
            </div>
        );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<ForgotPassword />);
</script>
</body>
</html>
